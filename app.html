<style>:root{padding-top:env(safe-area-inset-top)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: iOS-artige Tab-App. Große Titel, gruppierte Listen, Detailseiten schieben sich von rechts rein. */
:root{
  --bg:#E4E4E6; --card:#FFFFFF; --fg:#1D1D1F; --fg2:#6B6B70; --fg3:#A3A3A8;
  --sep:rgba(0,0,0,.09); --fill:rgba(0,0,0,.06); --press:rgba(0,0,0,.05);
  --accent:#1F4D3F; --accent-soft:rgba(31,77,63,.10); --red:#C8372D; --red-soft:rgba(200,55,45,.10);
  --bar:rgba(236,236,238,.78); --shadow:0 14px 22px -16px rgba(0,0,0,.38),0 1px 2px rgba(0,0,0,.06);
  --studio:linear-gradient(180deg,#ececee 0%,#e1e1e4 45%,#d6d6d9 100%);
  --tile:linear-gradient(160deg,#fbfbfc,#dcdcdf); --ink:#1D1D1F; --on-ink:#F5F5F7;
  --c1:#3E6E9E; --c2:#B5533F; --c3:#2E7A5A; --c4:#A8782A; --c5:#6B5A9E; --c6:#2D7F8A; --c7:#5B6472; --c8:#A84A6A;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:linear(0,.06 2%,.24 5%,.52 9%,.79 14%,.95 19%,1.03 24%,1.05 29%,1.03 37%,1.005 48%,.998 60%,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1B1D; --card:#2A2A2D; --fg:#ECECEE; --fg2:#9C9CA2; --fg3:#6C6C72;
  --sep:rgba(255,255,255,.09); --fill:rgba(255,255,255,.09); --press:rgba(255,255,255,.06);
  --accent:#9FD3BD; --accent-soft:rgba(159,211,189,.14); --red:#FF6A5C; --red-soft:rgba(255,106,92,.16);
  --bar:rgba(30,30,33,.78); --shadow:0 14px 22px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);
  --studio:linear-gradient(180deg,#2a2a2d 0%,#202023 55%,#18181a 100%);
  --tile:linear-gradient(160deg,#4a4a4f,#313135); --ink:#F5F5F7; --on-ink:#1D1D1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1B1D; --card:#2A2A2D; --fg:#ECECEE; --fg2:#9C9CA2; --fg3:#6C6C72;
  --sep:rgba(255,255,255,.09); --fill:rgba(255,255,255,.09); --press:rgba(255,255,255,.06);
  --accent:#9FD3BD; --accent-soft:rgba(159,211,189,.14); --red:#FF6A5C; --red-soft:rgba(255,106,92,.16);
  --bar:rgba(30,30,33,.78); --shadow:0 14px 22px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);
  --studio:linear-gradient(180deg,#2a2a2d 0%,#202023 55%,#18181a 100%);
  --tile:linear-gradient(160deg,#4a4a4f,#313135); --ink:#F5F5F7; --on-ink:#1D1D1F; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.search:focus-within,.form .row:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Navigationsleiste */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:44px;background:transparent;transition:background .5s,box-shadow .5s}
.nav.on{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .wrap{height:44px;display:flex;align-items:center;justify-content:center;position:relative}
.nav-t{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.nav.on .nav-t{opacity:1;transform:none}
.back{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:0;height:44px;display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding-right:10px}
.back svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;fill:none}
.back:active{opacity:.4}

.lt{font:700 34px/1.1 var(--font-d);letter-spacing:-.02em;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--fg2);font-size:15px;margin:0 0 18px}

/* Gruppierte Listen */
.gh{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:26px 16px 7px}
.gf{font-size:13px;color:var(--fg2);margin:7px 16px 0;line-height:1.4}
.grp{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 16px;position:relative;transition:background .3s}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.row.ic+.row::before,.row+.row.ic::before{left:58px}
a.row:active,button.row:active{background:var(--press)}
button.row{width:100%;text-align:left}
.row .l{flex:1;min-width:0}
.row .t{font-size:16px}
.row .mut{color:var(--fg2);font-size:14px}
.dt{width:30px;flex:none;text-align:center;line-height:1}
.dt small{display:block;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--c2);letter-spacing:.02em}
.dt b{display:block;font:600 17px/1.15 var(--font-d);font-variant-numeric:tabular-nums}
.dt.now small{color:var(--c3)} .dt.now b{color:var(--c3)}
.free{font-size:11.5px;font-weight:600;color:var(--c3);background:color-mix(in srgb,var(--c3) 14%,transparent);border-radius:5px;padding:1px 6px;vertical-align:2px;white-space:nowrap}
.row .d{font-size:13.5px;color:var(--fg2);margin-top:2px}
.row .v{color:var(--fg2);font-size:15px;text-align:right;max-width:58%;font-variant-numeric:tabular-nums}
.row.kv{align-items:flex-start}
.row.kv .t{color:var(--fg)}
.row.txt{display:block;font-size:15px;line-height:1.45}
.chev{width:14px;height:14px;stroke:var(--fg3);stroke-width:2.6;fill:none;flex:none}
.ext{width:15px;height:15px;stroke:var(--fg3);stroke-width:2.2;fill:none;flex:none}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.num{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.pill{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}

/* Start */
.sos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sos a{background:var(--card);border-radius:12px;padding:12px 4px 10px;text-align:center;box-shadow:var(--shadow);transition:transform .4s var(--ease)}
.sos a:active{transform:scale(.95)}
.sos b{display:block;font:700 22px/1 var(--font-d);color:var(--red);font-variant-numeric:tabular-nums}
.sos span{display:block;font-size:11.5px;color:var(--fg2);margin-top:5px}
.sos a.main{grid-column:span 2;background:var(--red);}
.sos a.main b,.sos a.main span{color:#fff}
.sos a.main b{font-size:28px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .4s var(--ease)}
.tile:active{transform:scale(.97)}
.tile b{font:700 24px/1.05 var(--font-d);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:block}
.tile b small{font-size:15px;font-weight:600;color:var(--fg2);margin-left:2px}
.tile span{font-size:13px;color:var(--fg2);display:block;margin-top:5px;line-height:1.3}
.chk{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--fg3);display:grid;place-items:center;flex:none;transition:background .4s,border-color .4s,transform .5s var(--ease)}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:opacity .4s,transform .6s var(--ease)}
.done .chk{background:var(--c3);border-color:var(--c3)}
.done .chk svg{opacity:1;transform:none}
.done .t{color:var(--fg2);text-decoration:line-through;text-decoration-color:var(--fg3)}
.chk-btn{padding:4px;margin:-4px}
.chk-btn:active .chk{transform:scale(.85)}

/* Suche */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:38px;padding:0 10px;margin-bottom:6px}
.search svg{width:17px;height:17px;stroke:var(--fg2);stroke-width:2.3;fill:none;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);outline:none}
.search input::placeholder{color:var(--fg2)}
.search button{color:var(--fg2);font-size:13px;padding:4px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Segmente und Chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;position:relative;margin:4px 0 12px}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.06);transition:transform .7s var(--ease)}
.seg button{position:relative;z-index:1;height:30px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 4px;padding:2px max(16px,env(safe-area-inset-left,0px)) 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--card);font-size:14px;box-shadow:var(--shadow);transition:background .4s,color .4s,transform .4s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.count{font-size:13px;color:var(--fg2);margin:10px 16px 0}

/* Tabelle */
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th{font-size:12px;font-weight:600;color:var(--fg2);text-align:left;padding:10px 16px 6px;text-transform:uppercase;letter-spacing:.03em}
.tbl td{padding:9px 16px;border-top:.5px solid var(--sep)}
.tbl td.m{color:var(--fg2);font-size:13px}

/* Tab-Ansicht + Detailseite */
#main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));transition:transform .38s var(--ease)}
#main.pushed{transform:translateX(-24%);}
.view{animation:fade .56s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateX(100%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s linear .38s;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.pane.open{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s}
.pane.drag{transition:none}
.pane .body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.pane .nav{top:0;padding-top:env(safe-area-inset-top,0px);height:calc(44px + env(safe-area-inset-top,0px))}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:52px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--fg3);transition:color .4s}
.tab svg{width:25px;height:25px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--ease)}
.tab[aria-current="page"]{color:var(--accent)}
.tab:active svg{transform:scale(.86)}

.foot{font-size:12.5px;color:var(--fg2);margin:28px 16px 0;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

@media (min-width:860px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .lt{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* Ergänzungen: Karte, Abstimmen, Formulare, Rechner */
.navr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:0;height:44px;display:flex;align-items:center;color:var(--accent);font-size:15px;font-weight:600;padding:0 4px}
.navr:active{opacity:.4}
.tile{text-align:left}
.mapbox{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:2px 0 12px;background:var(--fill);isolation:isolate}
#map{height:clamp(220px,34vh,380px);width:100%}
#map.nomap{height:0}
.locbtn{position:absolute;right:10px;top:10px;z-index:500;width:38px;height:38px;border-radius:10px;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15);transition:transform .4s var(--ease)}
.locbtn:active{transform:scale(.9)}
.locbtn svg{width:20px;height:20px;stroke:var(--accent);stroke-width:2;fill:none}
.mapcount{position:absolute;left:10px;top:10px;z-index:500;font-size:12px;font-weight:600;background:var(--card);color:var(--fg2);border-radius:8px;padding:5px 8px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.leaflet-popup-content-wrapper{border-radius:12px;background:var(--card);color:var(--fg);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:10px 14px;font:14px/1.4 var(--font)}
.leaflet-popup-content span{color:var(--fg2);font-size:13px}
.leaflet-popup-content a{color:var(--accent);font-weight:600}
.leaflet-container{background:var(--fill);font-family:var(--font)}
.leaflet-control-attribution{font-size:10px;background:var(--bar)!important;color:var(--fg2)}
.leaflet-control-attribution a{color:var(--fg2)}
.sortrow{margin:2px 0 0}
.seg.sm{margin:0 0 10px}
.seg.sm button{height:28px;font-size:12.5px}

.row.spot{padding:6px 8px 6px 16px;gap:8px}
.row.spot>a.l{padding:5px 0;display:block}
.row.spot>a.l:active{opacity:.55}
.vote{display:flex;flex-direction:column;align-items:center;flex:none;width:40px}
.vote button{width:40px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--fg3);transition:color .3s,background .3s,transform .4s var(--ease)}
.vote button:active{transform:scale(.85);background:var(--press)}
.vote svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.vote .up[aria-pressed="true"]{color:var(--c2)}
.vote .dn[aria-pressed="true"]{color:var(--c1)}
.vote b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg2);line-height:1;min-height:13px}
.vote b.pos{color:var(--c2)} .vote b.neg{color:var(--c1)}

.form .row{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:10px 16px}
.fl{font-size:12.5px;color:var(--fg2)}
.form input,.form select,.form textarea{font:inherit;font-size:16px;color:var(--fg);background:transparent;border:0;outline:none;padding:2px 0;width:100%;resize:vertical}
.form select{-webkit-appearance:none;appearance:none;background:transparent}
.form input::placeholder,.form textarea::placeholder{color:var(--fg3)}
.cta{display:block;width:100%;height:50px;margin-top:16px;border-radius:13px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;transition:transform .4s var(--ease),opacity .4s}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.5}
.d.cr{color:var(--accent);font-weight:500}

.calc .row.slide{padding:2px 16px 12px}
.calc .row.slide::before{display:none}
.cv{font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .5s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .6s var(--ease)}
.switch:checked{background:var(--c3)}
.switch:checked::after{transform:translateX(20px)}
label.row{cursor:pointer}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.box{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .6s,transform .6s var(--ease)}
.box span{display:block;font-size:13px;color:var(--fg2)}
.box b{display:block;font:700 24px/1.2 var(--font-d);font-variant-numeric:tabular-nums;margin-top:4px}
.box.win{border-color:var(--c3);transform:translateY(-2px)}
.verdict{font-size:16px;font-weight:600;margin:14px 16px 0}

.report{margin-top:26px}
.report summary{list-style:none;cursor:pointer;color:var(--accent);font-size:15px;padding:4px 16px}
.report summary::-webkit-details-marker{display:none}
#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;border-radius:14px;padding:10px 16px;max-width:calc(100% - 32px);text-align:center;transition:opacity .5s,transform .7s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Falak-Stil (aus Sajda): Studio-Licht, plastische Karten, Mono-Beschriftung, Sajda-Grün */
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--studio);pointer-events:none}
html{background:var(--bg)} body{background:transparent}
.pane{background:var(--studio),var(--bg)}
.lt{font-weight:700;letter-spacing:-.035em}
.count{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.gh{font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin-top:28px}
.grp,.sos a,.chip,.box,.mapbox,.tile{border-radius:14px}
.grp{box-shadow:var(--shadow)}
.tile{position:relative;overflow:hidden;background:var(--tile);transition:transform .7s var(--spring)}
.tile::after,.sos a.main::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 40%);pointer-events:none}
.tile span{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em}
.tile b{letter-spacing:-.03em}
.sos a{position:relative;overflow:hidden;transition:transform .7s var(--spring)}
.sos span{font-size:11px;letter-spacing:0}
.ico{background:linear-gradient(160deg,#8f8f94,#5f5f64)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 8px -4px rgba(0,0,0,.4)}
.chip{transition:background .5s,color .5s,transform .7s var(--spring)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg{border-radius:12px;padding:3px}
.seg i{top:3px;bottom:3px;left:3px;border-radius:9px;transition:transform .9s var(--spring)}
.cta{background:var(--ink);color:var(--on-ink);border-radius:14px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);transition:transform .7s var(--spring),opacity .4s}
.num,.pill{font-family:var(--mono)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}
#toast{background:var(--ink);color:var(--on-ink);border-radius:18px}
.done .chk,.switch:checked{background:var(--accent);border-color:var(--accent)}

/* Dein Istanbul: Merken-Knopf, Besucht-Stempel, Listen-Blatt */
:root{--been:#C08A2E}
.keep{width:34px;height:40px;display:grid;place-items:center;border-radius:9px;color:var(--fg3);flex:none;transition:color .3s,transform .6s var(--spring)}
.keep:active{transform:scale(.85);background:var(--press)}
.keep svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linejoin:round}
.keep.on{color:var(--accent)} .keep.on svg{fill:currentColor}
.been{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--been);margin-right:6px;vertical-align:-2px}
.been svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;fill:none}
.row.tip{padding-left:16px;gap:12px}
.d.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 1px}
.bar{height:5px;border-radius:3px;background:var(--fill);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;min-width:5px;background:var(--been);border-radius:inherit;transition:width 1.2s var(--ease)}
#smap{height:clamp(200px,30vh,320px);width:100%}
#smap.nomap{height:0}
.stamps{display:flex;flex-wrap:wrap;gap:7px}
.stamp{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;background:var(--card);color:var(--fg2);font-size:13.5px;box-shadow:var(--shadow)}
.stamp.on{background:var(--been);color:#fff}
.stamp svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none}
.gh.lh{display:flex;justify-content:space-between;align-items:baseline}
.gh.lh button{font-family:var(--font);font-size:13px;text-transform:none;letter-spacing:0;color:var(--red)}
.pop-keep{color:var(--accent);font-weight:600;font-size:14px}
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.32);opacity:0;transition:opacity .6s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;max-height:85vh;overflow-y:auto;overscroll-behavior:contain;background:var(--studio),var(--bg);border-radius:20px 20px 0 0;
  padding:8px 0 calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .9s var(--ease)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);opacity:.5;margin:0 auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 4px}
.sh-h h2{font:700 21px/1.2 var(--font-d);letter-spacing:-.02em;margin:0 0 2px}
.sh-h .sub{margin:0 0 14px}
.sh-x{color:var(--accent);font-weight:600;font-size:16px;padding:4px 2px;flex:none}
.sel .chk{background:var(--accent);border-color:var(--accent)} .sel .chk svg{opacity:1;transform:none}
.row.nl{gap:8px}
.row.nl input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);outline:none}
.row.nl input::placeholder{color:var(--fg3)}
.mini{flex:none;height:30px;padding:0 12px;border-radius:9px;background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:600}

/* Stil der neuen Startseite: warmes Papier, weiche Karten, bunte Symbole, schwebende Leiste */
