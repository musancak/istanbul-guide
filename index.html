<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Istanbul Studentenguide</title>

<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<style>
/* Layout: iOS-artige Tab-App. Große Titel, gruppierte Listen, Detailseiten schieben sich von rechts rein. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#111114; --fg2:#6C6C74; --fg3:#A1A1A8;
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --press:rgba(0,0,0,.05);
  --accent:#1C58B5; --accent-soft:rgba(28,88,181,.10); --red:#D9362B; --red-soft:rgba(217,54,43,.10);
  --bar:rgba(247,247,250,.80); --shadow:0 1px 0 rgba(0,0,0,.04);
  --c1:#2F6FD6; --c2:#E0533B; --c3:#2E9E5B; --c4:#E59A1B; --c5:#7A5AD8; --c6:#16A3B8; --c7:#5B6472; --c8:#D6457A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#9A9AA2; --fg3:#6A6A72;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --press:rgba(255,255,255,.06);
  --accent:#5E9BFF; --accent-soft:rgba(94,155,255,.16); --red:#FF5B4F; --red-soft:rgba(255,91,79,.16);
  --bar:rgba(18,18,20,.78); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --fg2:#9A9AA2; --fg3:#6A6A72;
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --press:rgba(255,255,255,.06);
  --accent:#5E9BFF; --accent-soft:rgba(94,155,255,.16); --red:#FF5B4F; --red-soft:rgba(255,91,79,.16);
  --bar:rgba(18,18,20,.78); --shadow:none; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Navigationsleiste */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:44px;background:transparent;transition:background .25s,box-shadow .25s}
.nav.on{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .wrap{height:44px;display:flex;align-items:center;justify-content:center;position:relative}
.nav-t{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.nav.on .nav-t{opacity:1;transform:none}
.back{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:0;height:44px;display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding-right:10px}
.back svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;fill:none}
.back:active{opacity:.4}

.lt{font:700 34px/1.1 var(--font-d);letter-spacing:-.02em;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--fg2);font-size:15px;margin:0 0 18px}

/* Gruppierte Listen */
.gh{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:26px 16px 7px}
.gf{font-size:13px;color:var(--fg2);margin:7px 16px 0;line-height:1.4}
.grp{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 16px;position:relative;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.row.ic+.row::before,.row+.row.ic::before{left:58px}
a.row:active,button.row:active{background:var(--press)}
button.row{width:100%;text-align:left}
.row .l{flex:1;min-width:0}
.row .t{font-size:16px}
.row .d{font-size:13.5px;color:var(--fg2);margin-top:2px}
.row .v{color:var(--fg2);font-size:15px;text-align:right;max-width:58%;font-variant-numeric:tabular-nums}
.row.kv{align-items:flex-start}
.row.kv .t{color:var(--fg)}
.row.txt{display:block;font-size:15px;line-height:1.45}
.chev{width:14px;height:14px;stroke:var(--fg3);stroke-width:2.6;fill:none;flex:none}
.ext{width:15px;height:15px;stroke:var(--fg3);stroke-width:2.2;fill:none;flex:none}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.num{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.pill{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}

/* Start */
.sos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sos a{background:var(--card);border-radius:12px;padding:12px 4px 10px;text-align:center;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.sos a:active{transform:scale(.95)}
.sos b{display:block;font:700 22px/1 var(--font-d);color:var(--red);font-variant-numeric:tabular-nums}
.sos span{display:block;font-size:11.5px;color:var(--fg2);margin-top:5px}
.sos a.main{grid-column:span 2;background:var(--red);}
.sos a.main b,.sos a.main span{color:#fff}
.sos a.main b{font-size:28px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.tile:active{transform:scale(.97)}
.tile b{font:700 24px/1.05 var(--font-d);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:block}
.tile b small{font-size:15px;font-weight:600;color:var(--fg2);margin-left:2px}
.tile span{font-size:13px;color:var(--fg2);display:block;margin-top:5px;line-height:1.3}
.chk{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--fg3);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .25s var(--ease)}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s var(--ease)}
.done .chk{background:var(--c3);border-color:var(--c3)}
.done .chk svg{opacity:1;transform:none}
.done .t{color:var(--fg2);text-decoration:line-through;text-decoration-color:var(--fg3)}
.chk-btn{padding:4px;margin:-4px}
.chk-btn:active .chk{transform:scale(.85)}

/* Suche */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:38px;padding:0 10px;margin-bottom:6px}
.search svg{width:17px;height:17px;stroke:var(--fg2);stroke-width:2.3;fill:none;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);outline:none}
.search input::placeholder{color:var(--fg2)}
.search button{color:var(--fg2);font-size:13px;padding:4px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Segmente und Chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;position:relative;margin:4px 0 12px}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.06);transition:transform .35s var(--ease)}
.seg button{position:relative;z-index:1;height:30px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 4px;padding:2px max(16px,env(safe-area-inset-left,0px)) 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--card);font-size:14px;box-shadow:var(--shadow);transition:background .2s,color .2s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.count{font-size:13px;color:var(--fg2);margin:10px 16px 0}

/* Tabelle */
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th{font-size:12px;font-weight:600;color:var(--fg2);text-align:left;padding:10px 16px 6px;text-transform:uppercase;letter-spacing:.03em}
.tbl td{padding:9px 16px;border-top:.5px solid var(--sep)}
.tbl td.m{color:var(--fg2);font-size:13px}

/* Tab-Ansicht + Detailseite */
#main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));transition:transform .5s var(--ease),filter .5s var(--ease)}
#main.pushed{transform:translateX(-24%);filter:brightness(.9)}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateX(100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s linear .5s;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.pane.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.pane.drag{transition:none}
.pane .body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.pane .nav{top:0;padding-top:env(safe-area-inset-top,0px);height:calc(44px + env(safe-area-inset-top,0px))}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:52px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--fg3);transition:color .2s}
.tab svg{width:25px;height:25px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.tab[aria-current="page"]{color:var(--accent)}
.tab:active svg{transform:scale(.86)}

.foot{font-size:12.5px;color:var(--fg2);margin:28px 16px 0;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

@media (min-width:860px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .lt{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<section id="pane" class="pane" aria-label="Detailseite"></section>

const ico=(k,c)=>`<span class="ico" style="background:var(${c})">${svg(k)}</span>`;
function rowHTML(r){
  if(typeof r==="string")return`<div class="row txt">${esc(r)}</div>`;
  if(Array.isArray(r))return`<div class="row kv"><div class="l t">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`;
  if(r.u)return`<a class="row" href="${esc(r.u)}" target="_blank" rel="noopener"><div class="l"><div class="t">${esc(r.l)}</div>${r.d?`<div class="d">${esc(r.d)}</div>`:""}</div>${svg("ext","ext")}</a>`;
  if(r.s)return r.s.map((x,i)=>`<div class="row"><span class="num">${i+1}</span><div class="l t">${esc(x)}</div></div>`).join("");
  if(r.tb)return`<div class="tbl"><table><thead><tr>${r.tb.h.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${r.tb.r.map(x=>`<tr>${x.map(c=>`<td class="${c==="direkt"?"m":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return"";
}
const pageRow=id=>{const p=P[id];return`<button class="row ic" data-go="${id}">${ico(p.i,p.c)}<div class="l"><div class="t">${esc(p.t)}</div>${p.s?`<div class="d">${esc(p.s)}</div>`:""}</div>${svg("chev","chev")}</button>`};
const group=(g,fn)=>`${g.h?`<div class="gh">${esc(g.h)}</div>`:'<div style="height:14px"></div>'}<div class="grp">${g.r.map(fn).join("")}</div>${g.f?`<div class="gf">${esc(g.f)}</div>`:""}`;
const navbar=(t,back)=>`<header class="nav"><div class="wrap">${back?`<button class="back" data-back>${svg("backc")}<span>${esc(back)}</span></button>`:""}<span class="nav-t">${esc(t)}</span></div></header>`;

/* ---------- Start ---------- */
const STEPS=[["s1","Istanbulkart am Flughafen holen","flughafen"],["s2","SIM-Karte kaufen, Pass mitnehmen","sim"],["s3","e-İkamet innerhalb von 30 Tagen","aufenthalt"],["s4","Studenten-Istanbulkart beantragen","istanbulkart"],["s5","Handy-Frist von 120 Tagen notieren","imei"],["s6","Notrufnummern speichern","notfall"]];
let done={};try{done=JSON.parse(localStorage.getItem("ist-done"))||{}}catch(e){}
function startHTML(){
  return`${navbar("Istanbul")}<div class="wrap view">
  <h1 class="lt">Istanbul</h1><p class="sub">Für Studierende · Stand 2026</p>
  <label class="search">${svg("search")}<input id="q" type="search" placeholder="Suchen: Taxi, Ramen, e-İkamet …" autocomplete="off" enterkeyhint="search"><button id="qx" hidden>Löschen</button></label>
  <div id="res"></div>
  <div id="home">
  <div class="gh">Notruf</div>
  <div class="sos"><a class="main" href="tel:112"><b>112</b><span>Alle Notdienste</span></a><a href="tel:155"><b>155</b><span>Polizei</span></a><a href="tel:110"><b>110</b><span>Feuer</span></a><a href="tel:157"><b>157</b><span>Touristen</span></a></div>
  <div class="gf">Nummern zum Abtippen. Mehr unter <button data-go="notfall" style="color:var(--accent)">Notfall</button>.</div>
  <div class="gh">Erste Tage</div>
  <div class="grp">${STEPS.map(([k,t,p])=>`<div class="row${done[k]?" done":""}" data-k="${k}"><button class="chk-btn" data-chk="${k}" aria-label="Erledigt: ${esc(t)}" aria-pressed="${!!done[k]}"><span class="chk">${svg("check")}</span></button><button class="l t" data-go="${p}" style="text-align:left">${esc(t)}</button>${svg("chev","chev")}</div>`).join("")}</div>
  <div class="gf">Abhaken wird nur auf diesem Gerät gespeichert.</div>
  <div class="gh">Preise auf einen Blick</div>
  <div class="tiles">
   <button class="tile" data-go="istanbulkart" style="text-align:left"><b>22,55<small>TL</small></b><span>Fahrt mit Studentenkarte</span></button>
   <button class="tile" data-go="istanbulkart" style="text-align:left"><b>653<small>TL</small></b><span>Monatskarte Student, 200 Fahrten</span></button>
   <button class="tile" data-go="taxi" style="text-align:left"><b>230<small>TL</small></b><span>Taxi-Mindestpreis</span></button>
   <button class="tile" data-go="einkaufen" style="text-align:left"><b>15<small>TL</small></b><span>Halk Ekmek, 250 g Brot</span></button>
  </div>
  <div class="gh">Beliebt</div>
  <div class="grp">${["sim","nacht","geld","wohnen"].map(pageRow).join("")}
   <button class="row ic" data-tab="essen">${ico("fork","--c2")}<div class="l"><div class="t">Food-Spots</div><div class="d">${SPOTS.length} Orte aus der Gruppe, nach Bezirk</div></div>${svg("chev","chev")}</button></div>
  <p class="foot">Zusammengestellt aus dem ESI Istanbul Survival Guide (2025/26), den Istanbul-Gruppenchats und der Food-Spot-Liste der Gruppe. Kein offizielles Angebot. Preise ändern sich schnell, vor Ort kurz prüfen.</p>
  </div></div>`;
}
function bindStart(){
  const q=document.getElementById("q"),res=document.getElementById("res"),home=document.getElementById("home"),qx=document.getElementById("qx");
  q.oninput=()=>{const v=q.value.trim();qx.hidden=!v;home.hidden=!!v;res.innerHTML=v?searchHTML(v):""};
  qx.onclick=()=>{q.value="";q.oninput();q.focus()};
  document.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{const k=b.dataset.chk;done[k]=!done[k];if(!done[k])delete done[k];
    try{localStorage.setItem("ist-done",JSON.stringify(done))}catch(e){}
    b.closest(".row").classList.toggle("done",!!done[k]);b.setAttribute("aria-pressed",!!done[k])});
}
/* Suchindex über alle Seiten und Spots */
const IDX=[];
for(const id in P)for(const g of P[id].g)for(const r of g.r){
  let txt=typeof r==="string"?r:Array.isArray(r)?r.join(": "):r.u?r.l+" "+(r.d||""):r.s?r.s.join(" · "):"";
  if(txt)IDX.push({id,txt,h:g.h||P[id].t});
}
function hl(s,v){const n=norm(s),i=n.indexOf(norm(v));if(i<0)return esc(s);return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+v.length))+"</mark>"+esc(s.slice(i+v.length))}
function searchHTML(v){
  const nv=norm(v);
  const pages=Object.keys(P).filter(id=>norm(P[id].t+" "+P[id].s).includes(nv));
  const hits=IDX.filter(x=>norm(x.txt).includes(nv)).slice(0,25);
  const sp=SPOTS.filter(s=>norm(s.n+" "+s.note+" "+s.d).includes(nv)).slice(0,25);
  if(!pages.length&&!hits.length&&!sp.length)return`<div class="gf" style="margin-top:20px">Nichts gefunden für „${esc(v)}“.</div>`;
  let h="";
  if(pages.length)h+=group({h:"Themen",r:pages},pageRow);
  if(hits.length)h+=group({h:"Infos",r:hits},x=>`<button class="row" data-go="${x.id}"><div class="l"><div class="t">${hl(x.txt.length>110?x.txt.slice(0,110)+"…":x.txt,v)}</div><div class="d">${esc(P[x.id].t)}</div></div>${svg("chev","chev")}</button>`);
  if(sp.length)h+=group({h:"Food-Spots"},null).replace('<div class="grp"></div>',"")+`<div class="grp">${sp.map(spotRow).join("")}</div>`;
  return h;
}

/* ---------- Essen ---------- */
let fk="r",fd="Alle",fq="";
const spotRow=s=>`<a class="row" href="${s.u}" target="_blank" rel="noopener"><div class="l"><div class="t">${esc(s.n)}${s.top?'<span class="pill">Top</span>':""}</div>${s.note||s.k==="t"?`<div class="d">${esc(s.note||s.d)}</div>`:""}</div>${svg("ext","ext")}</a>`;
function essenHTML(){
  const keys=Object.keys(F);
  return`${navbar("Essen")}<div class="wrap view">
  <h1 class="lt">Essen</h1><p class="sub">Food-Spots aus der Gruppe. Antippen öffnet Google Maps.</p>
  <div class="grp" style="margin-bottom:16px">
   <a class="row ic" href="${FOOD_LIST}" target="_blank" rel="noopener">${ico("pin","--c2")}<div class="l"><div class="t">Liste mit 500 Spots</div><div class="d">Google Maps, aus der Gruppe WiSe 26/27</div></div>${svg("ext","ext")}</a>
   <a class="row ic" href="${FOOD_DOC}" target="_blank" rel="noopener">${ico("doc","--c7")}<div class="l"><div class="t">Original-Liste</div><div class="d">Google Doc nach Bezirken</div></div>${svg("ext","ext")}</a>
  </div>
  <div class="seg" id="seg" role="group" aria-label="Art"><i></i>${keys.map(k=>`<button data-k="${k}" aria-pressed="${k===fk}">${F[k].t}</button>`).join("")}</div>
  <label class="search">${svg("search")}<input id="fq" type="search" placeholder="Burger, Mantı, Moda …" value="${esc(fq)}" autocomplete="off"></label>
  <div class="chips" id="chips"></div>
  <div id="flist"></div></div>`;
}
function bindEssen(){
  const seg=document.getElementById("seg"),pill=seg.querySelector("i"),btns=[...seg.querySelectorAll("button")];
  const place=()=>{const i=Object.keys(F).indexOf(fk);pill.style.width=`calc((100% - 4px) / ${btns.length})`;pill.style.transform=`translateX(${i*100}%)`;btns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===fk))};
  btns.forEach(b=>b.onclick=()=>{fk=b.dataset.k;fd="Alle";place();chips();list()});
  document.getElementById("fq").oninput=e=>{fq=e.target.value.trim();list()};
  place();chips();list();
}
function chips(){
  const el=document.getElementById("chips"),ds=["Alle",...Object.keys(F[fk].d)];
  el.innerHTML=ds.map(d=>`<button class="chip" aria-pressed="${d===fd}" data-d="${esc(d)}">${esc(d)}</button>`).join("");
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{fd=c.dataset.d;el.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));list()});
}
function list(){
  const nv=norm(fq);
  const s=SPOTS.filter(x=>x.k===fk&&(fd==="Alle"||x.d===fd)&&(!nv||norm(x.n+" "+x.note+" "+x.d).includes(nv)));
  const by={};s.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));
  const el=document.getElementById("flist");
  el.innerHTML=s.length?`<div class="count">${s.length} ${s.length===1?"Ort":"Orte"}</div>`+Object.keys(by).map(d=>`<div class="gh">${esc(d)}</div><div class="grp">${by[d].map(spotRow).join("")}</div>`).join(""):`<div class="gf" style="margin-top:20px">Kein Spot passt. Anderen Bezirk oder Begriff probieren.</div>`;
  el.firstElementChild&&el.animate&&el.animate([{opacity:.4},{opacity:1}],{duration:180});
}

/* ---------- Tabs, Seiten, Navigation ---------- */
function tabHTML(t){return`${navbar(t.t)}<div class="wrap view"><h1 class="lt">${esc(t.t)}</h1><p class="sub">${esc(t.s)}</p>${t.g.map(g=>group(g,pageRow)).join("")}<p class="foot">Angaben laut ESI Survival Guide und Gruppenchats, Stand 2025/26.</p></div>`}
function pageHTML(id,back){const p=P[id];return`${navbar(p.t,back)}<div class="wrap body"><h1 class="lt">${esc(p.t)}</h1>${p.s?`<p class="sub">${esc(p.s)}</p>`:""}${p.g.map(g=>group(g,rowHTML)).join("")}</div>`}

const main=document.getElementById("main"),pane=document.getElementById("pane"),tabsEl=document.getElementById("tabs");
let tab="start",page=null;
tabsEl.innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}">${svg(t.i)}<span>${t.t}</span></button>`).join("");

function showTab(id){
  const t=TABS.find(x=>x.id===id)||TABS[0];tab=t.id;
  main.innerHTML=t.id==="start"?startHTML():t.id==="essen"?essenHTML():tabHTML(t);
  if(t.id==="start")bindStart();if(t.id==="essen")bindEssen();
  tabsEl.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  window.scrollTo(0,0);navScroll();
}
function openPage(id){
  if(!P[id])return;page=id;
  pane.innerHTML=pageHTML(id,(TABS.find(x=>x.id===tab)||TABS[0]).t);pane.scrollTop=0;
  requestAnimationFrame(()=>{pane.classList.add("open");main.classList.add("pushed")});
  paneScroll();
}
function closePage(){page=null;pane.classList.remove("open","drag");pane.style.transform="";main.classList.remove("pushed");main.style.transform=""}
function setHash(h){try{if(location.hash.slice(1)!==h)location.hash=h}catch(e){}}
function go(id){
  if(P[id]){openPage(id);setHash(id)}
  else{if(page)closePage();if(id!==tab||!main.innerHTML)showTab(id);setHash(id)}
}
function route(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  if(P[h]){if(!main.innerHTML)showTab(Object.keys(P).includes(h)?parentTab(h):"start");if(page!==h)openPage(h)}
  else if(TABS.some(t=>t.id===h)){if(page)closePage();if(h!==tab||!main.innerHTML)showTab(h)}
  else if(!main.innerHTML)showTab("start");
}
const parentTab=id=>(TABS.find(t=>t.g&&t.g.some(g=>g.r.includes(id)))||TABS[0]).id;

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"),t=e.target.closest("[data-tab]"),b=e.target.closest("[data-back]");
  if(b){e.preventDefault();closePage();setHash(tab);return}
  if(g){e.preventDefault();go(g.dataset.go);return}
  if(t){e.preventDefault();if(page)closePage();if(t.dataset.tab===tab&&!page){window.scrollTo({top:0,behavior:"smooth"})}else showTab(t.dataset.tab);setHash(t.dataset.tab)}
});
addEventListener("hashchange",route);

function navScroll(){const n=main.querySelector(".nav");if(n)n.classList.toggle("on",scrollY>34)}
function paneScroll(){const n=pane.querySelector(".nav");if(n)n.classList.toggle("on",pane.scrollTop>34)}
addEventListener("scroll",navScroll,{passive:true});
pane.addEventListener("scroll",paneScroll,{passive:true});

/* Wischen vom linken Rand zurück, wie auf dem iPhone */
let sx=null,dx=0;
pane.addEventListener("touchstart",e=>{const x=e.touches[0].clientX;if(x<28){sx=x;dx=0;pane.classList.add("drag");main.style.transition="none"}},{passive:true});
pane.addEventListener("touchmove",e=>{if(sx===null)return;dx=Math.max(0,e.touches[0].clientX-sx);const w=innerWidth;
  pane.style.transform=`translateX(${dx}px)`;main.style.transform=`translateX(${-24+24*dx/w}%)`},{passive:true});
pane.addEventListener("touchend",()=>{if(sx===null)return;sx=null;pane.classList.remove("drag");main.style.transition="";
  if(dx>innerWidth*.3){closePage();setHash(tab)}else{pane.style.transform="";main.style.transform=""}});

route();
</script>
</body></html>
