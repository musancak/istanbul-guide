<style>
/* ---------- Himmel oben ---------- */
.held{position:relative;height:calc(430px + env(safe-area-inset-top));overflow:hidden;color:#fff;--h1:#8EC5E8;--h2:#E9F1F4;--h3:#F6E7D2;--silh:#24384F;--wasser:#3E6E92}
.himmel{position:absolute;inset:-10% 0 0;background:linear-gradient(180deg,var(--h1) 0%,var(--h2) 62%,var(--h3) 100%);transition:background 4s}
.sterne{position:absolute;inset:0;opacity:0;transition:opacity 4s}.nacht .sterne{opacity:1}
.sterne i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:funkeln 7s ease-in-out infinite}
@keyframes funkeln{50%{opacity:.15;transform:scale(.6)}}
.gestirn{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF6D8,#FFD27A 60%,#F6A94B);box-shadow:0 0 50px 18px rgba(255,210,122,.45);transition:left 4s,top 4s}
.nacht .gestirn{width:30px;height:30px;margin:-15px 0 0 -15px;background:radial-gradient(circle at 35% 35%,#FFFFFF,#DCE3F0);box-shadow:0 0 40px 10px rgba(220,227,240,.25)}
.wolke{position:absolute;height:22px;border-radius:99px;background:rgba(255,255,255,.55);filter:blur(5px);animation:ziehen linear infinite}
.wolke.w1{top:22%;width:120px;animation-duration:140s;animation-delay:-40s}.wolke.w2{top:36%;width:80px;animation-duration:190s;animation-delay:-120s}
.nacht .wolke{background:rgba(255,255,255,.08)}
@keyframes ziehen{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;will-change:transform}
.skyline.hinten{bottom:46px;opacity:.45}
.skyline.vorne{width:150%;left:-25%}
.regen .himmel{filter:saturate(.45) brightness(.92)}.regen .gestirn{opacity:.25}.regen .wolke{background:rgba(255,255,255,.7);height:30px}
.tropfen{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 4s}.regen .tropfen{opacity:1}
.tropfen i{position:absolute;top:-20px;width:1.5px;height:16px;border-radius:2px;background:linear-gradient(transparent,rgba(255,255,255,.75));animation:fallen linear infinite}
@keyframes fallen{to{transform:translate(-30px,460px)}}
.hell{color:#1E2430}.hell .held-inhalt{text-shadow:none}.hell .suche{color:#1E2430;background:rgba(255,255,255,.45)}
.skyline path,.skyline rect,.skyline polygon{fill:var(--silh)}
.wasser{position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,var(--wasser),color-mix(in srgb,var(--wasser) 60%,#000))}
.wasser i{position:absolute;height:1.5px;border-radius:2px;background:rgba(255,255,255,.4);animation:glitzern 10s ease-in-out infinite}
@keyframes glitzern{50%{opacity:.1;transform:translateX(14px) scaleX(.6)}}
.faehre{position:absolute;bottom:20px;left:0;width:46px;animation:fahren 90s linear infinite}
.faehre path{fill:#fff}.faehre rect{fill:var(--koralle)}
@keyframes fahren{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
.held-inhalt{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 16px) 20px 0;text-shadow:0 1px 14px rgba(0,0,0,.18);will-change:transform,opacity}
.gruss{display:flex;align-items:center;gap:8px;opacity:.9}
.gruss b{font-weight:700}
.uhr{margin-left:auto}
#titel{font:800 52px/1 var(--font-d);letter-spacing:-.045em;margin:18px 0 6px}
#wetter{font-size:18px;font-weight:500;margin:0}
#sonne{margin:6px 0 0;opacity:.85}
.suche{position:relative;margin-top:18px;width:100%;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:16px;color:#fff;
 background:rgba(255,255,255,.2);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4),0 10px 30px -12px rgba(0,0,0,.35);font-size:16px}
.suche span{opacity:.85}
/* Kopfzeile, wenn der Himmel weggerollt ist */
.mini-kopf{position:fixed;z-index:40;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 20px 10px;display:flex;align-items:center;gap:8px;
 background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 .5px 0 var(--linie);transform:translateY(-100%);transition:transform .4s var(--feder)}
.mini-kopf.da{transform:none}
.mini-kopf b{font:700 17px var(--font-d);letter-spacing:-.02em}
.mini-kopf .mono{margin-left:auto;color:var(--fg2)}

/* ---------- Inhalt ---------- */
main{position:relative;z-index:2;margin-top:-30px;background:var(--bg);border-radius:30px 30px 0 0;padding:22px 16px calc(120px + env(safe-area-inset-bottom));max-width:720px;margin-left:auto;margin-right:auto;box-shadow:0 -10px 30px -18px rgba(0,0,0,.25)}
.kopf{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:30px 6px 10px;display:flex;justify-content:space-between}
.kopf:first-child{margin-top:4px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{position:relative;border-radius:22px;padding:15px 16px;background:var(--karte);box-shadow:var(--schatten);overflow:hidden;min-height:132px;display:flex;flex-direction:column;transform-style:preserve-3d}
.k.breit{grid-column:span 2}
.k .mono{color:var(--fg2)}
.k::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,0%),rgba(255,255,255,.35),transparent 55%);opacity:.7}
.gross{font:700 34px/1 var(--font-d);letter-spacing:-.04em;margin-top:auto}
.klein{font-size:13px;color:var(--fg2);margin-top:5px}
.k.farbig{color:#fff}.k.farbig .mono,.k.farbig .klein{color:rgba(255,255,255,.8)}
/* Wort des Tages: Karte zum Umdrehen */
.wort{min-height:150px;padding:0;background:none;box-shadow:none;perspective:900px;overflow:visible}
.wort::after{display:none}
.wort-in{position:relative;flex:1;transform-style:preserve-3d;transition:transform .6s var(--feder)}
.wort.um .wort-in{transform:rotateY(180deg)}
.seite-a,.seite-b{position:absolute;inset:0;border-radius:22px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden;color:#fff;box-shadow:var(--schatten);
 background:linear-gradient(135deg,var(--tuerkis),color-mix(in srgb,var(--tuerkis) 55%,var(--kobalt)))}
.seite-b{transform:rotateY(180deg);background:linear-gradient(135deg,var(--kobalt),color-mix(in srgb,var(--kobalt) 60%,#1E2430))}
.seite-a .mono,.seite-b .mono{color:rgba(255,255,255,.75)}
.muster{position:absolute;right:-30px;top:-30px;width:170px;height:170px;opacity:.16;animation:drehen 120s linear infinite}
.muster path{fill:none;stroke:#fff;stroke-width:1.2}
@keyframes drehen{to{transform:rotate(360deg)}}
.tr{font:700 32px/1.05 var(--font-d);letter-spacing:-.03em;margin-top:auto}
.de{font-size:15px;line-height:1.4;margin-top:auto}
.aus{font:12px var(--mono);opacity:.8;margin-top:6px}
.hoeren{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.hoeren .i{width:19px;height:19px}
.hoeren.spricht{animation:sprechen 1.6s ease-in-out infinite}
@keyframes sprechen{50%{box-shadow:0 0 0 8px rgba(255,255,255,.12)}}
.tipp{font-size:12px;opacity:.7;margin-top:6px}
/* Notruf */
.notruf{background:linear-gradient(150deg,var(--koralle),color-mix(in srgb,var(--koralle) 70%,#7A1F18))}
.puls{position:absolute;right:16px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff}
.puls::before,.puls::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;animation:pulsen 4.8s ease-out infinite}
.puls::after{animation-delay:2.4s}
@keyframes pulsen{to{transform:scale(3.4);opacity:0}}
/* Ring */
.ring{position:relative;width:62px;height:62px;margin-top:auto}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bahn{stroke:var(--fuell)}.ring .voll{stroke:var(--minze);transition:stroke-dashoffset 2.8s var(--feder)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 17px var(--font-d)}
/* Stempel */
.punkte{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:auto}
.punkte i{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--fg3);transition:background .8s,border-color .8s,transform .4s var(--feder)}
.punkte i.an{background:var(--koralle);border:1.5px solid var(--koralle)}
.punkte i.neu{animation:stempelPunkt 1.4s var(--feder)}
@keyframes stempelPunkt{0%{transform:scale(2.2);opacity:0}}
/* Spot des Tages */
.spot{background:linear-gradient(140deg,color-mix(in srgb,var(--safran) 22%,var(--karte)),var(--karte) 70%)}
.spot-name{font:700 24px/1.1 var(--font-d);letter-spacing:-.03em;margin-top:14px}
.spot-rest{font-size:14px;color:var(--fg2);margin-top:4px;min-height:20px}
.spot-knoepfe{display:flex;gap:8px;margin-top:14px}
.knopf{padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;background:var(--tinte);color:var(--auf-tinte)}
.knopf.hell{background:var(--fuell);color:var(--fg)}
/* Events-Laufband */
.events{min-height:0;padding:14px 0 14px}
.events .mono{padding:0 16px}
.band{display:flex;gap:28px;width:max-content;margin-top:10px;animation:laufen 75s linear infinite}
.events:hover .band,.events:active .band{animation-play-state:paused}
@keyframes laufen{to{transform:translateX(-50%)}}
.ev{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:15px;font-weight:500}
.ev time{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--fuell);font:700 15px/1 var(--font-d);text-align:center}
.ev time small{display:block;font:600 8.5px var(--mono);letter-spacing:.06em;color:var(--koralle);margin-bottom:2px}
/* Preise im Wechsel */
.preis{min-height:0;flex-direction:row;align-items:center;gap:14px}
.preis .gross{margin:0;font-size:30px}
.preis-text{flex:1;min-width:0}
.preis-text b{display:block;font-weight:600}
.preis-punkte{display:flex;gap:4px}.preis-punkte i{width:5px;height:5px;border-radius:50%;background:var(--fg3);transition:width .8s var(--feder),background .6s}.preis-punkte i.an{width:16px;border-radius:3px;background:var(--fg)}
/* Themen */
.themen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.thema{position:relative;min-height:150px;border-radius:24px;padding:16px;color:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--schatten);
 background:linear-gradient(150deg,color-mix(in srgb,var(--f) 80%,#fff),var(--f) 55%,color-mix(in srgb,var(--f) 70%,#000))}
.thema .gross-i{position:absolute;right:-14px;bottom:-14px;width:110px;height:110px;opacity:.22;stroke-width:1.3;transition:transform 1.6s var(--feder)}
.thema:active .gross-i{transform:rotate(-12deg) scale(1.1)}
.thema b{font:700 22px/1.1 var(--font-d);letter-spacing:-.03em;margin-top:auto}
.thema small{font:11px var(--mono);letter-spacing:.04em;opacity:.8;margin-top:4px}
.thema .klein-i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.thema .klein-i .i{width:17px;height:17px}
/* Beliebt: Karussell */
.karussell{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:6px 16px 18px}
.karussell::-webkit-scrollbar{display:none}
.kk{flex:none;width:72%;scroll-snap-align:center;border-radius:22px;padding:16px;background:var(--karte);box-shadow:var(--schatten);display:flex;flex-direction:column;gap:10px;min-height:140px;transition:transform .3s linear,opacity .3s linear}
.kk b{font:700 19px/1.15 var(--font-d);letter-spacing:-.02em;margin-top:auto}
.kk small{color:var(--fg2);font-size:13.5px}
.fussnote{font-size:12.5px;color:var(--fg2);text-align:center;margin:34px 10px 0;line-height:1.5}
.fussnote a{color:var(--gruen);font-weight:600}
/* ---------- Leiste unten ---------- */
.leiste{position:fixed;z-index:50;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;padding:6px;border-radius:26px;
 background:color-mix(in srgb,var(--karte) 72%,transparent);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:0 16px 40px -14px rgba(40,25,10,.45),inset 0 0 0 .5px var(--linie)}
.leiste button{position:relative;z-index:1;width:58px;height:50px;display:grid;place-items:center;color:var(--fg2);transition:color .6s}
.leiste button[aria-current=true]{color:var(--auf-tinte)}
.leiste .i{width:23px;height:23px;transition:transform .4s var(--feder)}
.leiste button:active .i{transform:scale(.8)}
.blob{position:absolute;z-index:0;top:6px;left:6px;width:58px;height:50px;border-radius:20px;background:var(--tinte);transition:transform .38s var(--feder),width .38s var(--feder)}
/* Suche, Checkliste */
.such-feld{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:var(--karte);box-shadow:var(--schatten);margin:8px 0 14px}
.such-feld input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--fg);outline:none;min-width:0}
.leer{color:var(--fg2);text-align:center;padding:30px 10px}
.check{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--fg3);display:grid;place-items:center;flex:none;transition:background .6s,border-color .6s,transform .4s var(--feder)}
.check .i{width:15px;height:15px;color:#fff;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .8s .2s var(--sanft)}
.an-c .check{background:var(--minze);border-color:var(--minze);transform:scale(1.08)}
.an-c .check .i{stroke-dashoffset:0}
.an-c b{color:var(--fg2);text-decoration:line-through}
.funke{position:fixed;z-index:99;width:7px;height:7px;border-radius:2px;pointer-events:none}
@media (prefers-color-scheme:dark){
 .seite-a{background:linear-gradient(135deg,#1B6672,#22427A)}.seite-b{background:linear-gradient(135deg,#2B4C9B,#18223C)}
 .notruf{background:linear-gradient(150deg,#B8473A,#6A1E17)}
 .thema{background:linear-gradient(150deg,color-mix(in srgb,var(--f) 72%,#000),color-mix(in srgb,var(--f) 42%,#000))}
 .mini{background:linear-gradient(150deg,color-mix(in srgb,var(--f) 75%,#000),color-mix(in srgb,var(--f) 50%,#000))}
 .k::after{opacity:.15}}
/* Die Systemeinstellung gilt auch für dekorative Endlosschleifen. */
@media(prefers-reduced-motion:reduce){
 .wolke,.faehre,.muster,.band,.wasser i,.sterne i,.tropfen i{animation:none!important}}
@media(min-width:700px){.bento{grid-template-columns:repeat(4,1fr)}.themen{grid-template-columns:repeat(4,1fr)}.kk{width:42%}}
/* Endlosschleifen pausieren außerhalb des sichtbaren Himmels und im Hintergrund. */
#held.ruht *,html.inaktiv *{animation-play-state:paused!important}
.events:focus-within .band{animation-play-state:paused}
</style>

  <div class="held-inhalt" id="heldInhalt">

</header>

<main id="inhalt">

  <div class="bento" id="bento">
    <button class="k breit wort" id="wort" aria-label="Wort des Tages, antippen zum Umdrehen">
      <div class="wort-in">
        <div class="seite-a"><svg class="muster" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 5l12 21 24-3-9 22 18 15-23 7v24L50 79 28 91V67L5 60l18-15-9-22 24 3z"/><path d="M50 25l7 12 14-2-5 13 11 9-14 4v14L50 68 37 75V61l-14-4 11-9-5-13 14 2z"/><circle cx="50" cy="50" r="9"/></svg>
          <span class="mono">TÜRKISCH · WORT DES TAGES</span><span class="tr" id="wortTr"></span><span class="tipp">Antippen zum Umdrehen</span></div>
        <div class="seite-b"><span class="mono" id="wortTr2"></span><span class="de" id="wortDe"></span><span class="aus" id="wortAus"></span><span class="hoeren" id="hoeren" role="button" aria-label="Anhören"></span></div>

<script>
/* ---------- Daten der Startseite ---------- */
const WOERTER=[["Kolay gelsin","Möge es dir leicht fallen. Sagt man zu allen, die gerade arbeiten.","ko-LAI gel-SIN"],["Afiyet olsun","Guten Appetit, auch nach dem Essen als Dank an die Köchin.","a-fi-JET ol-SUN"],["Hesap lütfen","Die Rechnung, bitte.","he-SAP lüt-FEN"],["Ne kadar?","Wie viel kostet das?","ne ka-DAR"],["Öğrenciyim","Ich bin Student oder Studentin. Lohnt sich bei Rabatten.","ö-ren-DSCHI-jim"],["Aktarma","Umsteigen. Mit der Istanbulkart wird es dabei billiger.","ak-tar-MA"],["Durak","Haltestelle.","du-RAK"],["İndirim var mı?","Gibt es einen Rabatt?","in-di-RIM var-MI"],["Çok güzel","Sehr schön. Passt fast immer.","tschok gü-SEL"],["Sağ ol","Danke, locker und kurz.","SA ol"],["Pardon","Entschuldigung, um durchzukommen.","par-DON"],["Bir çay lütfen","Einen Tee, bitte.","bir TSCHAI lüt-FEN"],["Nerede?","Wo ist das?","NE-re-de"],["Tamam","Okay, passt.","ta-MAM"],["Yavaş yavaş","Langsam, ganz entspannt.","ja-WASCH ja-WASCH"],["Geçmiş olsun","Gute Besserung, auch nach Ärger aller Art.","getsch-MISCH ol-SUN"],["Kira","Miete.","ki-RA"],["Ev sahibi","Vermieter oder Vermieterin.","ew sa-hi-BI"],["Eczane","Apotheke.","edsch-sa-NE"],["Görüşürüz","Bis bald.","gö-rü-schü-RÜS"],["Hadi","Los, komm.","HA-di"],["İnşallah","Hoffentlich, so Gott will.","in-SCHAL-lah"],["Maşallah","Wie schön, als Bewunderung.","MA-schal-lah"],["Boş mu?","Ist der Platz frei?","BOSCH mu"],["Fatura","Rechnung für Strom, Wasser oder Internet.","fa-TU-ra"]];
const PREISE=[["22,55","Fahrt Studi · TL","Istanbulkart, ermäßigt","istanbulkart"],["653","Monatskarte Studi · TL","200 Fahrten im Monat","istanbulkart"],["46,20","Fahrt normal · TL","Istanbulkart, ohne Rabatt","istanbulkart"],["230","Taxi mindestens · TL","Taxameter, 47,92 TL pro km","taxi"]];
const SCHRITTE=[["s1","Istanbulkart am Flughafen holen","flughafen"],["s2","SIM-Karte kaufen, Pass mitnehmen","sim"],["s3","e-İkamet rechtzeitig beantragen","aufenthalt"],["s4","Studenten-Istanbulkart beantragen","istanbulkart"],["s5","Handy-Frist von 120 Tagen notieren","imei"],["s6","Notrufnummern speichern","notfall"]];
const BELIEBT=["sim","wohnen","nacht","geld","flughafen","muzekart","viertel"];
let done={};try{done=JSON.parse(localStorage.getItem("ist-done"))||{}}catch(e){}

/* ---------- Himmel nach Tageszeit ---------- */
const PHASEN={nacht:["#0B1530","#1E3260","#3A4C7A","#0A1226","#132544"],morgen:["#F2A97E","#F6CDA8","#FBE6CF","#2E2E44","#5E6E92"],tag:["#6FB2E0","#BFDDF0","#F3E6D3","#24384F","#3E6E92"],abend:["#E9785A","#F2A673","#F8D7A9","#2B2238","#5A4E78"]};
const minuten=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
function himmel(L){
  const t=istZeit(),jetzt=t.getHours()*60+t.getMinutes(),auf=minuten(L.auf),unter=minuten(L.unter);
  const ph=jetzt<auf-40||jetzt>unter+40?"nacht":jetzt<auf+60?"morgen":jetzt>unter-60?"abend":"tag";
  const [h1,h2,h3,silh,wasser]=PHASEN[ph],held=$("#held");
  held.style.cssText=`--h1:${h1};--h2:${h2};--h3:${h3};--silh:${silh};--wasser:${wasser}`;held.classList.toggle("nacht",ph==="nacht");held.classList.toggle("hell",ph==="tag"||ph==="morgen");
  /* Sonne bzw. Mond auf ihrem Bogen */
  let p=ph==="nacht"?((jetzt-unter+1440)%1440)/((auf-unter+1440)%1440):(jetzt-auf)/(unter-auf);p=Math.max(.04,Math.min(.96,p));
  const g=$("#gestirn");g.style.left=(8+p*84)+"%";g.style.top=(74-Math.sin(p*Math.PI)*24)+"%";
  const [tr,de]=t.getHours()<11?["GÜNAYDIN","Guten Morgen"]:t.getHours()<17?["İYİ GÜNLER","Schönen Tag"]:t.getHours()<22?["İYİ AKŞAMLAR","Schönen Abend"]:["İYİ GECELER","Gute Nacht"];
  $("#grussTr").textContent=tr;$("#grussDe").textContent="· "+de;
  return{jetzt,unter};
}
function sterne(){const s=$("#sterne");s.innerHTML=Array.from({length:40},(_,i)=>`<i style="left:${(i*37)%100}%;top:${(i*53)%62}%;animation-delay:${-(i%9)*.4}s;opacity:${.4+(i%5)/8}"></i>`).join("")}
function wasser(){$("#wasser").innerHTML=Array.from({length:14},(_,i)=>`<i style="left:${(i*29)%96}%;top:${10+(i*17)%38}px;width:${14+(i*7)%26}px;animation-delay:${-i*.6}s"></i>`).join("")}

/* ---------- Uhr mit rollenden Ziffern ---------- */
function uhr(){const t=istZeit();rollen($("#uhr"),`${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`)}

/* ---------- Kopfbereich ---------- */
async function kopf(){
  sterne();wasser();
  const ersatz={auf:"07:00",unter:"17:56"};let {jetzt,unter}=himmel(ersatz);
  uhr();setInterval(uhr,15e3);
  const t=istZeit();$("#datum").textContent=`${TAGE[t.getDay()]}, ${t.getDate()}. ${MON[t.getMonth()]}`;
  wirbeln($("#titel"),"İstanbul",2000);
  const L=await live();({jetzt,unter}=himmel(L));
  const [art,ikon]=WX(L.code);
  if(ikon==="rain"){$("#held").classList.add("regen");$("#tropfen").innerHTML=Array.from({length:leise?0:36},(_,i)=>`<i style="left:${(i*41)%104}%;animation-duration:${.7+(i%5)*.12}s;animation-delay:${-(i*.13)}s"></i>`).join("")}
  $("#wetter").textContent=`${L.temp}° · ${art} · ${L.min}–${L.max}°`;unscharfRein($("#wetter"));
  const rest=minuten(L.unter)-jetzt;
  $("#sonne").textContent=rest>0?`SONNENUNTERGANG ${L.unter} · IN ${Math.floor(rest/60)} STD ${rest%60} MIN`:`SONNENAUFGANG MORGEN ${L.auf}`;
  unscharfRein($("#sonne"),300);
  $("#miniWetter").textContent=`${L.temp}° ${art.toUpperCase()}`;
  /* Euro */
  setTimeout(()=>{rollen($("#kurs"),zahl(L.kurs,2));$("#kursKlein").innerHTML=`TL für 1 €<br>100 TL = ${zahl(100/L.kurs,2)} €`},500);
  /* Events-Laufband */
  const ev=(L.ev||[]).filter(e=>(e.ends||e.starts)>=istZeit().toISOString().slice(0,10));
  const heute=istZeit().toISOString().slice(0,10);
  const html=(ev.length?ev:[{starts:"",title:"Events dieser Woche"}]).map(e=>{const laeuft=e.starts&&e.starts<heute&&e.ends,[,m,d]=((laeuft?e.ends:e.starts)||"--").split("-");return`<span class="ev"><time><span><small>${laeuft?"BIS":m?MON[m-1].toUpperCase():"·"}</small>${d?+d:""}</span></time>${esc(e.title)}${e.place?` <span style="color:var(--fg2);font-weight:400">· ${esc(e.place)}</span>`:""}</span>`}).join("");
  $("#band").innerHTML=html+html;
  /* ruhiges Tempo: etwa 20 Pixel pro Sekunde, egal wie viele Events */
  requestAnimationFrame(()=>{const b=$("#band");const d=Math.max(60,b.scrollWidth/2/20)+"s";b.style.animationDuration=d;b.style.setProperty("--band",d)});
}

/* ---------- Wort des Tages ---------- */
function wort(){
  const [tr,de,aus]=WOERTER[tagNr%WOERTER.length],w=$("#wort");
  $("#wortTr").textContent=tr;$("#wortTr2").textContent=tr.toUpperCase();$("#wortDe").textContent=de;$("#wortAus").textContent=aus;
  const h=$("#hoeren");h.innerHTML=`<svg viewBox="0 0 24 24" class="i"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
  w.onclick=e=>{if(e.target.closest("#hoeren"))return;w.classList.toggle("um")};
  h.onclick=e=>{e.stopPropagation();if(!("speechSynthesis"in window))return toast("Dein Browser kann nicht vorlesen.");
    const u=new SpeechSynthesisUtterance(tr);u.lang="tr-TR";u.rate=.85;const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith("tr"));if(v)u.voice=v;
    h.classList.add("spricht");u.onend=u.onerror=()=>h.classList.remove("spricht");speechSynthesis.cancel();speechSynthesis.speak(u)};
}

/* ---------- Spot des Tages ---------- */
let spotV=0;
function spot(anim){
  const s=spotDesTages(spotV),box=$("#spotBox");
  const setz=()=>{$("#spotName").textContent=s.n;$("#spotRest").textContent=[s.d,s.note].filter(Boolean).join(" · ");$("#spotKarte").href=maps(s)};
  if(!anim||leise)return setz();
  box.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(-30px)"}],{duration:220,easing:"ease-in"}).onfinish=()=>{setz();
    box.animate([{opacity:0,transform:"translateX(40px)"},{opacity:1,transform:"none"}],{duration:600,easing:FEDER})};
}
$("#spotWeiter").onclick=()=>{spotV++;spot(true)};

/* ---------- Checkliste mit Ring ---------- */
function ring(){const n=SCHRITTE.filter(s=>done[s[0]]).length;$("#ringVoll").style.strokeDashoffset=163.4*(1-n/6);$("#ringZahl").textContent=`${n}/6`}
function funken(x,y){if(leise)return;const F=["--minze","--safran","--koralle","--tuerkis"];for(let i=0;i<14;i++){const f=document.createElement("i");f.className="funke";f.style.cssText=`left:${x}px;top:${y}px;background:var(${F[i%4]})`;document.body.appendChild(f);
  const a=Math.random()*Math.PI*2,d=40+Math.random()*60;f.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+30}px) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:800+Math.random()*400,easing:SANFT}).onfinish=()=>f.remove()}}
$("#ersteK").onclick=e=>{
  const s=oeffne(`<h1 class="s-gross">Erste Tage</h1><p class="s-sub">Abhaken bleibt nur auf diesem Gerät.</p><div class="gruppe">${SCHRITTE.map(([k,t,p])=>`<div class="z ${done[k]?"an-c":""}"><button class="check" data-k="${k}" aria-pressed="${!!done[k]}" aria-label="${esc(t)}">${ic("check")}</button><button class="z-text" data-seite="${p}" style="flex:1"><b>${esc(t)}</b></button>${ic("chev","chev")}</div>`).join("")}</div>`,e.currentTarget,"Erste Tage");
  $$(".check",s).forEach(b=>b.onclick=ev=>{const k=b.dataset.k;if(done[k])delete done[k];else{done[k]=1;const r=b.getBoundingClientRect();funken(r.left+13,r.top+13)}
    try{localStorage.setItem("ist-done",JSON.stringify(done))}catch(x){}b.closest(".z").classList.toggle("an-c",!!done[k]);b.setAttribute("aria-pressed",!!done[k]);ring()});
  $$("[data-seite]",s).forEach(b=>b.onclick=()=>seiteOeffnen(b.dataset.seite,b));
};

/* ---------- Stempelheft ---------- */
function stempelheft(neu){
  const n=IstanbulPass.anzahl();
  $("#punkte").innerHTML=IST_ORT.map(o=>`<i class="${IstanbulPass.hat(o.id)?"an":""}${o.id===neu?" neu":""}" title="${esc(o.name)}"></i>`).join("");
  $("#stempelText").textContent=n?`${n} von ${IST_ORT.length} Orten besucht`:"Neue Orte entdecken, Stempel sammeln";
}
document.addEventListener("orte-gestempelt",e=>stempelheft(e.detail));
$("#stempelK").onclick=e=>entdeckerOeffnen(e.currentTarget);

/* ---------- Preise im Wechsel ---------- */
let preisI=0;
function preis(){const [z,was,info,seite]=PREISE[preisI];rollen($("#preisZahl"),z);$("#preisWas").textContent=was;$("#preisInfo").textContent=info;$("#preisK").dataset.seite=seite;
  $("#preisPunkte").innerHTML=PREISE.map((_,i)=>`<i class="${i===preisI?"an":""}"></i>`).join("")}
setInterval(()=>{if(document.hidden||leise||offen)return;preisI=(preisI+1)%PREISE.length;preis()},7000);

/* ---------- Themen und Beliebt ---------- */
function themen(){
  $("#themen").innerHTML=THEMEN.map(t=>`<button class="thema" data-thema="${t.id}" style="--f:var(--${{verkehr:"kobalt",essen:"koralle",alltag:"minze",entdecken:"safran"}[t.id]})"><span class="klein-i">${ic(t.i)}</span>${ic(t.i,"i gross-i")}<b>${t.t}</b><small>${t.id==="essen"?SPOTS.length+" SPOTS":t.id==="entdecken"?IST_ORT.length+" ORTE":t.r.length+" SEITEN"}</small></button>`).join("");
  $("#themenZahl").textContent=`${ALLE_SEITEN.length} Seiten · ${SPOTS.length} Spots`;
  $$(".thema").forEach(b=>{kippen(b,10);b.onclick=()=>themaOeffnen(THEMEN.find(t=>t.id===b.dataset.thema),b)});
  const farbe=id=>`var(--${["kobalt","koralle","minze","safran","tuerkis"][BELIEBT.indexOf(id)%5]})`;
  $("#karussell").innerHTML=BELIEBT.filter(id=>P[id]).map(id=>`<button class="kk" data-seite="${id}"><span class="mini" style="--f:${farbe(id)}">${ic(P[id].i||"doc")}</span><b>${esc(P[id].t)}</b><small>${esc(P[id].s||"")}</small></button>`).join("");
  const k=$("#karussell"),skal=()=>{const m=k.getBoundingClientRect().left+k.clientWidth/2;$$(".kk",k).forEach(c=>{const r=c.getBoundingClientRect(),d=Math.min(1,Math.abs(r.left+r.width/2-m)/r.width);c.style.transform=`scale(${1-d*.08})`;c.style.opacity=1-d*.35})};
  let skalFrame=0;const planen=()=>{if(leise||skalFrame)return;skalFrame=requestAnimationFrame(()=>{skalFrame=0;skal()})};
  k.addEventListener("scroll",planen,{passive:true});addEventListener("resize",planen);if(!leise)skal();
}
document.addEventListener("click",e=>{const b=e.target.closest("main [data-seite]");if(b&&!e.target.closest(".seite"))seiteOeffnen(b.dataset.seite,b)});

/* ---------- Suche ---------- */
const norm=s=>String(s).toLowerCase().replace(/ı/g,"i").normalize("NFD").replace(/[̀-ͯ]/g,"");
$("#suche").innerHTML=`${ic("search")}<span>Taxi, Ramen, e-İkamet …</span>`;
$("#suche").onclick=e=>{
  const s=oeffne(`<h1 class="s-gross">Suchen</h1><label class="such-feld">${ic("search")}<input id="sq" type="search" placeholder="Taxi, Ramen, e-İkamet …" autocomplete="off" enterkeyhint="search"></label><div id="streffer"></div>`,e.currentTarget,"Suchen");
  const q=$("#sq",s),out=$("#streffer",s);setTimeout(()=>q.focus(),350);
  q.oninput=()=>{const v=norm(q.value.trim());if(!v){out.innerHTML="";return}
    const w=v.split(/\s+/),passt=t=>w.every(x=>norm(t).includes(x));
    const seiten=ALLE_SEITEN.filter(id=>passt(P[id].t+" "+P[id].s+" "+JSON.stringify(P[id].g))).slice(0,12),sp=SPOTS.filter(x=>passt(x.n+" "+x.d+" "+x.note)).slice(0,15);
    out.innerHTML=(seiten.length?`<h3>Seiten</h3><div class="gruppe">${seiten.map(id=>`<button class="z pfeil" data-seite="${id}"><span class="mini" style="--f:var(--tuerkis)">${ic(P[id].i||"doc")}</span><span><b>${esc(P[id].t)}</b><small>${esc(P[id].s||"")}</small></span>${ic("chev","chev")}</button>`).join("")}</div>`:"")+
      (sp.length?`<h3>Food-Spots</h3><div class="gruppe">${sp.map(x=>`<a class="z link" href="${maps(x)}" target="_blank" rel="noopener"><span><b>${esc(x.n)}</b><small>${esc([x.d,x.note].filter(Boolean).join(" · "))}</small></span>${ic("ext")}</a>`).join("")}</div>`:"")||`<p class="leer">Nichts gefunden für „${esc(q.value)}“.</p>`;
    $$("[data-seite]",out).forEach(b=>b.onclick=()=>seiteOeffnen(b.dataset.seite,b));staffeln($$(".gruppe",out),{abstand:60,dauer:420})};
};

/* ---------- Leiste unten mit wanderndem Blob ---------- */
function leiste(){
  /* Themen links und rechts, Treffen in der Mitte */
  const l=$("#leiste"),th=THEMEN.map(t=>`<button data-tab="${t.id}" aria-label="${t.t}" aria-current="false">${ic(t.i)}</button>`);
  th.splice(2,0,`<button class="mitte" id="tabTreffen" data-tab="treffen" aria-label="Treffen" aria-current="false"><span class="rund">${ic("people")}</span><span class="badge" hidden></span></button>`);
  l.insertAdjacentHTML("beforeend",th.join(""));
  const blob=$("#blob"),setz=b=>{$$("button",l).forEach(x=>x.setAttribute("aria-current",x===b));blob.classList.toggle("weg",!b||b.dataset.tab==="treffen");if(!b||b.dataset.tab==="treffen")return;
    blob.style.transform=`translateX(${b.offsetLeft-6}px)`;blob.animate([{scale:"1 1"},{scale:"1.25 .85"},{scale:"1 1"}],{duration:leise?1:500,easing:SANFT})};
  setz(null);tabZahl();
  $$("button",l).forEach(b=>b.onclick=()=>{if(b.getAttribute("aria-current")==="true"){offen&&offen();return}setz(b);const war=offen;offen&&offen();
    setTimeout(()=>{const s=b.dataset.tab==="treffen"?treffenOeffnen(b):themaOeffnen(THEMEN.find(t=>t.id===b.dataset.tab),b);
      if(!s)return;new MutationObserver((_,o)=>{if(!s.isConnected){o.disconnect();if(b.getAttribute("aria-current")==="true")setz(null)}}).observe(document.body,{childList:true})},war&&!leise?280:0)});
}

/* ---------- Rollen: Himmel-Parallaxe und Mini-Kopf ---------- */
function rollenEffekt(){
  const vorne=$("#vorne"),hinten=$("#hinten"),inhalt=$("#heldInhalt"),g=$("#gestirn"),mk=$("#miniKopf");let wartet=false;
  addEventListener("scroll",()=>{if(wartet)return;wartet=true;requestAnimationFrame(()=>{wartet=false;const y=Math.min(500,Math.max(0,scrollY));
    if(!leise){hinten.style.transform=`translateY(${y*.35}px)`;vorne.style.transform=`translateY(${y*.18}px)`;g.style.translate=`0 ${y*.5}px`;
      inhalt.style.transform=`translateY(${y*.45}px) scale(${1-Math.min(y,300)/1500})`;inhalt.style.opacity=1-Math.min(1,y/240)}
    mk.classList.toggle("da",y>300)})},{passive:true});
}

/* ---------- Start ---------- */
kopf();wort();spot();ring();stempelheft();preis();themen();leiste();rollenEffekt();
staffeln($$("#bento>*"),{start:250,abstand:70});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);staffeln([...e.target.children],{abstand:70,von:"translateY(30px) scale(.94)"})}}),{threshold:.15});
const himmelIO=new IntersectionObserver(es=>es.forEach(e=>$("#held").classList.toggle("ruht",!e.isIntersecting)));
himmelIO.observe($("#held"));
document.addEventListener("visibilitychange",()=>document.documentElement.classList.toggle("inaktiv",document.hidden));
io.observe($("#themen"));io.observe($("#karussell"));
$$(".k:not(.wort)").forEach(k=>kippen(k,5));
setTimeout(()=>{$("#ringVoll").style.strokeDashoffset=163.4;requestAnimationFrame(()=>requestAnimationFrame(ring))},0);
</script>
